<body class="bg-gray-100 p-6">
  <div class="max-w-4xl mx-auto bg-white p-6 rounded shadow">
    <h1 class="text-2xl font-bold mb-4">Select Grade and Lessons</h1>

    <!-- Grade Selection -->
    <label for="grade" class="block mb-2 font-semibold">Select Grade:</label>

      <option value="8">Grade 8</option>
      <option value="9">Grade 9</option>
      <option value="10">Grade 10</option>

      <select id="strand" class="w-full p-2 border rounded">

        <option value="HUMSS">HUMSS</option>
        <option value="TVL">TVL</option>

    <!-- Lessons display -->

    const gradeSelect = document.getElementById("grade");
    const strandContainer = document.getElementById("strand-container");
    const strandSelect = document.getElementById("strand");
    const subjectContainer = document.getElementById("subject-container");
    const subjectSelect = document.getElementById("subject");
    const lessonsContainer = document.getElementById("lessons-container");
    const lessonContent = document.getElementById("lesson-content");
    const lessonsTitle = document.getElementById("lessons-title");

    gradeSelect.addEventListener("change", () => {
      lessonsContainer.classList.add("hidden");
      lessonContent.innerHTML = "";
      subjectSelect.innerHTML = '<option value="" disabled selected>Choose Subject</option>';
      subjectContainer.classList.add("hidden");
      strandSelect.value = "";
      strandContainer.classList.add("hidden");

      const grade = gradeSelect.value;

      if (["11", "12"].includes(grade)) {
        strandContainer.classList.remove("hidden");
      } else if (["7", "8", "9", "10"].includes(grade)) {
        showSubjects(grade);
      }
    });

    strandSelect.addEventListener("change", () => {
      lessonsContainer.classList.add("hidden");
      lessonContent.innerHTML = "";
      subjectSelect.innerHTML = '<option value="" disabled selected>Choose Subject</option>';
      subjectContainer.classList.remove("hidden");

      const grade = gradeSelect.value;
      const strand = strandSelect.value;

      if (grade && strand) {
        showSubjects(`${grade}_${strand}`);
      }
    });

    subjectSelect.addEventListener("change", () => {
      const subject = subjectSelect.value;
      if (!subject) return;

      showLessons(subject);
    });

    function showSubjects(key) {
      const subjects = subjectsData[key] || [];
      subjectSelect.innerHTML = '<option value="" disabled selected>Choose Subject</option>';
      subjects.forEach(subj => {
        const option = document.createElement("option");
        option.value = subj;
        option.textContent = subj;
        subjectSelect.appendChild(option);
      });
      subjectContainer.classList.remove("hidden");
    }

    function showLessons(subject) {
      lessonsTitle.textContent = `Lessons for ${subject}`;
      const lesson = lessonsData[subject];

      if (!lesson) {
        lessonContent.innerHTML = "<p>No lessons available for this subject yet.</p>";
        lessonsContainer.classList.remove("hidden");
        return;
      }

     lessonContent.innerHTML = `
  <div class="bg-[#f0e8e1] p-6 rounded-lg shadow-md space-y-6">
    <div class="border-l-4 border-[#d79e4b] pl-4">
      <h2 class="text-[#551a25] text-xl font-bold mb-2">Paragraphs</h2>
      <p class="text-gray-800">${lesson.paragraphs}</p>
    </div>

    <div class="border-l-4 border-[#d79e4b] pl-4">
      <h2 class="text-[#551a25] text-xl font-bold mb-2">Essay</h2>
      <p class="text-gray-800">${lesson.essay}</p>
    </div>

    <div class="border-l-4 border-[#d79e4b] pl-4">
      <h2 class="text-[#551a25] text-xl font-bold mb-2">Explanation</h2>
      <p class="text-gray-800">${lesson.explanation}</p>
    </div>

    <div class="border-l-4 border-[#d79e4b] pl-4">
      <h2 class="text-[#551a25] text-xl font-bold mb-2">Fun Facts</h2>
      <p class="text-gray-800">${lesson.funFacts}</p>
    </div>

    <div class="border-l-4 border-[#d79e4b] pl-4">
      <h2 class="text-[#551a25] text-xl font-bold mb-2">Infographic</h2>
      <p class="text-gray-800">${lesson.infographic}</p>
    </div>

    <div class="mt-4">
  <h2 class="text-[#551a25] text-xl font-bold mb-2">Video</h2>
  <video controls class="w-full rounded border border-[#d79e4b]">
    <source src="${lesson.video}" type="video/mp4">
    Your browser does not support the video tag.
  </video>
</div>

  </div>
`;

      lessonsContainer.classList.remove("hidden");
